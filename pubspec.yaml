name: room_aura
description: "Room Aura — Imagine it. Place it. Make it yours."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/

